<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Art Club sprite-sheet PNG browser verification</title>
</head>
<body>
  <pre id="result">RUNNING</pre>
  <script src="../js/sprite-sheet-export.js"></script>
  <script>
    (async function () {
      const output = document.getElementById("result");

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      // Small browser-side structural comparison used for layout/rectangle arrays.
      // The page intentionally has no dependency on Node's assert module.
      assert.deepEqual = function (actual, expected, message) {
        if (JSON.stringify(actual) !== JSON.stringify(expected)) {
          throw new Error(message + " Actual: " + JSON.stringify(actual) +
            "; expected: " + JSON.stringify(expected) + ".");
        }
      };

      function expectThrow(callback, pattern, label) {
        let thrown = null;
        try {
          callback();
        } catch (error) {
          thrown = error;
        }
        assert(thrown, label + " should reject invalid input.");
        assert(pattern.test(String(thrown.message || thrown)), label + " returned an unexpected error: " + thrown);
      }

      function expectedRaster() {
        const width = 7;
        const height = 7;
        const rgba = new Uint8ClampedArray(width * height * 4);
        const colors = {
          transparent: [0, 0, 0, 0],
          red: [255, 0, 0, 255],
          green: [0, 255, 0, 255],
          blue: [0, 0, 255, 255],
          white: [255, 255, 255, 255],
          yellow: [255, 255, 0, 255],
          magenta: [255, 0, 255, 255],
          cyan: [0, 255, 255, 255],
          orange: [255, 136, 0, 255]
        };

        function place(x, y, rows) {
          rows.forEach(function (row, rowIndex) {
            row.forEach(function (key, columnIndex) {
              const offset = ((y + rowIndex) * width + x + columnIndex) * 4;
              rgba.set(colors[key], offset);
            });
          });
        }

        // Explicit expected placement for frame order f3, f1, f2 in a 2-column
        // grid, with 1px outer margin and 1px gutters.
        place(1, 1, [
          ["transparent", "cyan"],
          ["orange", "transparent"]
        ]);
        place(4, 1, [
          ["red", "transparent"],
          ["green", "white"]
        ]);
        place(1, 4, [
          ["blue", "yellow"],
          ["transparent", "magenta"]
        ]);
        return rgba;
      }

      const sourcePixelsByFrame = {
        f3: [null, "#00ffff", "#ff8800", null],
        f1: ["#ff0000", null, "#00ff00", "#ffffff"],
        f2: ["#0000ff", "#ffff00", null, "#ff00ff"]
      };

      function makeExpectedRaster(width, height, placements, backgroundColor) {
        const rgba = new Uint8ClampedArray(width * height * 4);
        const background = backgroundColor
          ? [
              parseInt(backgroundColor.slice(1, 3), 16),
              parseInt(backgroundColor.slice(3, 5), 16),
              parseInt(backgroundColor.slice(5, 7), 16),
              255
            ]
          : [0, 0, 0, 0];
        for (let offset = 0; offset < rgba.length; offset += 4) rgba.set(background, offset);

        placements.forEach(function (placement) {
          const pixels = sourcePixelsByFrame[placement.frameId];
          pixels.forEach(function (color, index) {
            if (color === null) return;
            const x = placement.x + (index % 2);
            const y = placement.y + Math.floor(index / 2);
            const offset = (y * width + x) * 4;
            rgba.set([
              parseInt(color.slice(1, 3), 16),
              parseInt(color.slice(3, 5), 16),
              parseInt(color.slice(5, 7), 16),
              255
            ], offset);
          });
        });
        return rgba;
      }

      async function decodeAndCompare(blob, width, height, expected, label) {
        const bitmap = await createImageBitmap(blob);
        try {
          assert(bitmap.width === width && bitmap.height === height,
            label + " decoded dimensions were " + bitmap.width + "×" + bitmap.height +
            ", expected " + width + "×" + height + ".");
          const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
          const context = canvas.getContext("2d", { willReadFrequently: true });
          assert(context, label + " could not create a 2D context.");
          context.drawImage(bitmap, 0, 0);
          const actual = Array.from(context.getImageData(0, 0, width, height).data);
          const expectedBytes = Array.from(expected);
          assert(actual.length === expectedBytes.length, label + " RGBA buffer has the wrong byte length.");
          let mismatch = -1;
          for (let index = 0; index < expectedBytes.length; index += 1) {
            if (actual[index] !== expectedBytes[index]) {
              mismatch = index;
              break;
            }
          }
          if (mismatch !== -1) {
            const pixel = Math.floor(mismatch / 4);
            const x = pixel % width;
            const y = Math.floor(pixel / width);
            throw new Error(
              label + " decoded RGBA mismatch at (" + x + "," + y + "), channel " + (mismatch % 4) +
              ": expected " + expectedBytes[mismatch] + ", received " + actual[mismatch] + "."
            );
          }
        } finally {
          bitmap.close();
        }
      }

      try {
        const Exporter = window.ArtClubSpriteSheetExporter;
        assert(Exporter, "Sprite-sheet exporter did not load.");

        const layer = {
          id: "layer-main",
          name: "Main",
          visible: true,
          locked: false,
          opacity: 1
        };
        const project = {
          format: "one-pixel-studio",
          version: 2,
          id: "sprite-sheet-browser-fixture",
          name: "Sprite sheet browser fixture",
          canvas: { width: 2, height: 2, background: null },
          palette: ["#ff0000", "#00ff00", "#0000ff", "#ffffff", "#ffff00", "#ff00ff", "#00ffff", "#ff8800"],
          selectedColorIndex: 0,
          layers: [layer],
          frames: [
            { id: "f1", name: "Idle", durationMs: 100 },
            { id: "f2", name: "Step", durationMs: 180 },
            { id: "f3", name: "Contact", durationMs: 240 }
          ],
          cels: [
            { layerId: layer.id, frameId: "f1", pixels: ["#ff0000", null, "#00ff00", "#ffffff"] },
            { layerId: layer.id, frameId: "f2", pixels: ["#0000ff", "#ffff00", null, "#ff00ff"] },
            { layerId: layer.id, frameId: "f3", pixels: [null, "#00ffff", "#ff8800", null] }
          ],
          activeLayerId: layer.id,
          activeFrameId: "f1",
          metadata: {
            createdAt: "2026-01-01T00:00:00.000Z",
            updatedAt: "2026-01-01T00:00:00.000Z"
          }
        };

        const originalProject = JSON.stringify(project);
        const exported = await Exporter.exportSpriteSheet(project, {
          frameIds: ["f3", "f1", "f2"],
          layout: "grid",
          columns: 2,
          margin: 1,
          spacing: 1,
          imageFilename: "deterministic-grid.png"
        });

        assert(exported.blob && exported.blob.type === "image/png", "Exporter must return an image/png Blob.");
        assert(exported.blob.size > 32, "PNG Blob should contain encoded image data.");
        assert(JSON.stringify(project) === originalProject, "Export must not mutate the source project.");

        const pngSignature = new Uint8Array(await exported.blob.slice(0, 8).arrayBuffer());
        const expectedSignature = [137, 80, 78, 71, 13, 10, 26, 10];
        assert(JSON.stringify(Array.from(pngSignature)) === JSON.stringify(expectedSignature),
          "Blob does not have the PNG signature.");

        const expectedWidth = 7;
        const expectedHeight = 7;
        assert(exported.sheet.width === expectedWidth && exported.sheet.height === expectedHeight,
          "RGBA sheet dimensions should be 7×7.");
        assert(exported.sheet.frameCount === 3, "RGBA sheet should contain three selected frames.");

        const expectedFrames = [
          { index: 0, frameId: "f3", name: "Contact", x: 1, y: 1, width: 2, height: 2, durationMs: 240 },
          { index: 1, frameId: "f1", name: "Idle", x: 4, y: 1, width: 2, height: 2, durationMs: 100 },
          { index: 2, frameId: "f2", name: "Step", x: 1, y: 4, width: 2, height: 2, durationMs: 180 }
        ];
        const metadata = JSON.parse(JSON.stringify(exported.metadata));
        assert(metadata.format === "one-pixel-studio-sprite-sheet" && metadata.version === 1,
          "JSON metadata format/version mismatch.");
        assert(metadata.image.filename === "deterministic-grid.png", "Metadata filename mismatch.");
        assert(metadata.image.width === expectedWidth && metadata.image.height === expectedHeight,
          "Metadata image dimensions mismatch.");
        assert(metadata.canvas.frameWidth === 2 && metadata.canvas.frameHeight === 2,
          "Metadata source frame dimensions mismatch.");
        assert(metadata.layout.type === "grid" && metadata.layout.columns === 2 && metadata.layout.rows === 2,
          "Metadata grid dimensions/order mismatch.");
        assert(metadata.layout.margin === 1 && metadata.layout.spacing === 1,
          "Metadata margin/spacing mismatch.");
        assert(metadata.frameCount === expectedFrames.length, "Metadata frame count mismatch.");
        assert(JSON.stringify(metadata.frames) === JSON.stringify(expectedFrames),
          "JSON frame metadata does not match the expected frame order, positions and durations: " +
          JSON.stringify(metadata.frames));

        const expected = expectedRaster();
        assert(JSON.stringify(Array.from(exported.sheet.rgba)) === JSON.stringify(Array.from(expected)),
          "Exporter RGBA sheet buffer differs from the independent expected raster.");

        // Decode the actual grid PNG Blob in Chromium and compare every RGBA byte.
        const gridPlacements = [
          { frameId: "f3", x: 1, y: 1 },
          { frameId: "f1", x: 4, y: 1 },
          { frameId: "f2", x: 1, y: 4 }
        ];
        await decodeAndCompare(
          exported.blob,
          expectedWidth,
          expectedHeight,
          makeExpectedRaster(expectedWidth, expectedHeight, gridPlacements, null),
          "Grid PNG with transparent margin and spacing"
        );

        // Async sprite-sheet output preserves the exact sheet and metadata,
        // and Chromium independently decodes the resulting PNG Blob.
        const asyncProgress = [];
        const asyncExported = await Exporter.exportSpriteSheetAsync(project, {
          frameIds: ["f3", "f1", "f2"],
          layout: "grid",
          columns: 2,
          margin: 1,
          spacing: 1,
          imageFilename: "deterministic-grid.png",
          yieldEvery: 4,
          onProgress(event) { asyncProgress.push(event); }
        });
        assert(asyncExported.blob && asyncExported.blob.type === "image/png",
          "Async exporter must return an image/png Blob.");
        assert(JSON.stringify(asyncExported.metadata) === JSON.stringify(exported.metadata),
          "Async PNG metadata differs from the synchronous output.");
        assert(JSON.stringify(Array.from(asyncExported.sheet.rgba)) ===
          JSON.stringify(Array.from(exported.sheet.rgba)),
          "Async PNG RGBA buffer differs from the synchronous output.");
        for (let index = 1; index < asyncProgress.length; index += 1) {
          assert(asyncProgress[index].progress >= asyncProgress[index - 1].progress,
            "Async PNG progress moved backwards.");
        }
        assert(asyncProgress.length && asyncProgress[asyncProgress.length - 1].progress === 100,
          "Async PNG progress did not finish at 100%.");
        await decodeAndCompare(
          asyncExported.blob,
          expectedWidth,
          expectedHeight,
          makeExpectedRaster(expectedWidth, expectedHeight, gridPlacements, null),
          "Async grid PNG decoded in Chromium"
        );

        async function expectAsyncAbort(promise, stage, label) {
          try {
            await promise;
          } catch (error) {
            assert(error.code === "EXPORT_ABORTED" && error.stage === stage,
              label + " returned wrong cancellation details: " + error.code + "/" + error.stage);
            return;
          }
          throw new Error(label + " unexpectedly returned a successful export.");
        }
        const earlyAbort = new AbortController();
        earlyAbort.abort();
        await expectAsyncAbort(Exporter.exportSpriteSheetAsync(project, {
          signal: earlyAbort.signal
        }), "before-start", "Early async PNG cancellation");

        const composeAbort = new AbortController();
        await expectAsyncAbort(Exporter.exportSpriteSheetAsync(project, {
          signal: composeAbort.signal,
          yieldEvery: 1,
          onProgress(event) {
            if (event.phase === "composition" && event.progress > 12) composeAbort.abort();
          }
        }), "composition", "Mid-composition async PNG cancellation");

        const renderAbort = new AbortController();
        await expectAsyncAbort(Exporter.exportSpriteSheetAsync(project, {
          signal: renderAbort.signal,
          yieldEvery: 1,
          onProgress(event) {
            if (event.phase === "render") renderAbort.abort();
          }
        }), "encoding", "ImageData preparation cancellation");

        // Canvas PNG codecs are not interruptible internally. Aborting inside
        // the codec call is observed immediately after it resolves; no Blob is
        // returned to the caller.
        const codecAbort = new AbortController();
        const abortingCanvasFactory = function (width, height) {
          const canvas = new OffscreenCanvas(width, height);
          return {
            getContext: canvas.getContext.bind(canvas),
            async convertToBlob(options) {
              codecAbort.abort();
              return canvas.convertToBlob(options);
            }
          };
        };
        await expectAsyncAbort(Exporter.exportSpriteSheetAsync(project, {
          signal: codecAbort.signal,
          canvasFactory: abortingCanvasFactory
        }), "finalization", "Cancellation during non-interruptible PNG codec");

        // Check every supported strip layout in a real browser as well.
        const horizontal = await Exporter.exportSpriteSheet(project, {
          frameIds: ["f3", "f1", "f2"],
          layout: "horizontal",
          imageFilename: "deterministic-horizontal.png"
        });
        assert.deepEqual(
          [horizontal.sheet.width, horizontal.sheet.height],
          [6, 2],
          "Horizontal sprite sheet dimensions mismatch."
        );
        assert.deepEqual(
          horizontal.sheet.frames.map(frame => [frame.frameId, frame.x, frame.y]),
          [["f3", 0, 0], ["f1", 2, 0], ["f2", 4, 0]],
          "Horizontal frame order/rectangles mismatch."
        );
        await decodeAndCompare(
          horizontal.blob,
          6,
          2,
          makeExpectedRaster(6, 2, [
            { frameId: "f3", x: 0, y: 0 },
            { frameId: "f1", x: 2, y: 0 },
            { frameId: "f2", x: 4, y: 0 }
          ], null),
          "Horizontal strip PNG"
        );

        const vertical = await Exporter.exportSpriteSheet(project, {
          frameIds: ["f3", "f1", "f2"],
          layout: "vertical",
          imageFilename: "deterministic-vertical.png"
        });
        assert.deepEqual(
          [vertical.sheet.width, vertical.sheet.height],
          [2, 6],
          "Vertical sprite sheet dimensions mismatch."
        );
        assert.deepEqual(
          vertical.sheet.frames.map(frame => [frame.frameId, frame.x, frame.y]),
          [["f3", 0, 0], ["f1", 0, 2], ["f2", 0, 4]],
          "Vertical frame order/rectangles mismatch."
        );
        await decodeAndCompare(
          vertical.blob,
          2,
          6,
          makeExpectedRaster(2, 6, [
            { frameId: "f3", x: 0, y: 0 },
            { frameId: "f1", x: 0, y: 2 },
            { frameId: "f2", x: 0, y: 4 }
          ], null),
          "Vertical strip PNG"
        );

        // Explicit background fills margins, gutters and transparent source pixels.
        const background = await Exporter.exportSpriteSheet(project, {
          frameIds: ["f3", "f1", "f2"],
          layout: "grid",
          columns: 2,
          margin: 1,
          spacing: 1,
          backgroundColor: "#123456",
          imageFilename: "deterministic-grid-background.png"
        });
        await decodeAndCompare(
          background.blob,
          7,
          7,
          makeExpectedRaster(7, 7, gridPlacements, "#123456"),
          "Grid PNG with explicit background color"
        );

        // Guard regressions in invalid/oversized input handling.
        const invalidDimensions = structuredClone(project);
        invalidDimensions.canvas.width = 513;
        expectThrow(function () {
          Exporter.buildSpriteSheet(invalidDimensions);
        }, /Canvas width/, "513px canvas dimension");

        expectThrow(function () {
          Exporter.buildSpriteSheet(project, {
            layout: "grid",
            columns: 2,
            margin: 1,
            spacing: 1,
            maxPixels: 48
          });
        }, /Maximum export pixels|too large/i, "output budget below the 49-pixel sheet");

        const invalidColor = structuredClone(project);
        invalidColor.cels[0].pixels[0] = "#xyzxyz";
        expectThrow(function () {
          Exporter.buildSpriteSheet(invalidColor);
        }, /valid.*colors/i, "malformed cel color");

        const sparsePixels = structuredClone(project);
        delete sparsePixels.cels[0].pixels[1];
        expectThrow(function () {
          Exporter.buildSpriteSheet(sparsePixels);
        }, /valid.*colors/i, "sparse cel pixel slot");

        const sparseCels = structuredClone(project);
        sparseCels.cels = new Array(1);
        expectThrow(function () {
          Exporter.buildSpriteSheet(sparseCels);
        }, /Every cel/, "sparse cel list");

        const malformedSheet = {
          ...exported.sheet,
          rgba: new Uint8ClampedArray(4)
        };
        expectThrow(function () {
          Exporter.buildMetadata(malformedSheet);
        }, /RGBA.*length|buffer length/i, "malformed sheet metadata buffer");

        // Maximum project canvas: independent Chromium PNG decode checks every
        // pixel, not just the in-memory RGBA buffer or PNG signature.
        const maxWidth = 512;
        const maxHeight = 512;
        const maxPixels = new Array(maxWidth * maxHeight).fill(null);
        maxPixels[0] = "#123456";
        maxPixels[maxPixels.length - 1] = "#abcdef";
        const maxProject = {
          format: "one-pixel-studio",
          version: 2,
          id: "maximum-canvas-browser-fixture",
          name: "Maximum canvas PNG fixture",
          canvas: { width: maxWidth, height: maxHeight, background: null },
          palette: ["#123456", "#abcdef"],
          selectedColorIndex: 0,
          layers: [{ id: "max-layer", name: "Maximum", visible: true, locked: false, opacity: 1 }],
          frames: [{ id: "max-frame", name: "Maximum frame", durationMs: 145 }],
          cels: [{ layerId: "max-layer", frameId: "max-frame", pixels: maxPixels }],
          activeLayerId: "max-layer",
          activeFrameId: "max-frame",
          metadata: { createdAt: "2026-01-01T00:00:00.000Z", updatedAt: "2026-01-01T00:00:00.000Z" }
        };
        const maxOriginal = JSON.stringify(maxProject);
        const maxExport = await Exporter.exportSpriteSheet(maxProject, { imageFilename: "maximum-canvas.png" });
        assert(maxExport.blob.type === "image/png", "Maximum-canvas export must be PNG.");
        assert(maxExport.sheet.width === maxWidth && maxExport.sheet.height === maxHeight,
          "Maximum-canvas sheet dimensions mismatch.");
        assert(maxExport.sheet.rgba.length === maxWidth * maxHeight * 4,
          "Maximum-canvas RGBA buffer length mismatch.");
        assert(JSON.stringify(maxProject) === maxOriginal, "Maximum-canvas export mutated its source project.");

        const maxBitmap = await createImageBitmap(maxExport.blob);
        try {
          assert(maxBitmap.width === maxWidth && maxBitmap.height === maxHeight,
            "Decoded maximum PNG dimensions mismatch.");
          const maxCanvas = new OffscreenCanvas(maxWidth, maxHeight);
          const maxContext = maxCanvas.getContext("2d", { willReadFrequently: true });
          maxContext.drawImage(maxBitmap, 0, 0);
          const actual = maxContext.getImageData(0, 0, maxWidth, maxHeight).data;
          assert(actual.length === maxWidth * maxHeight * 4, "Decoded maximum PNG raster length mismatch.");
          for (let pixel = 0; pixel < maxWidth * maxHeight; pixel += 1) {
            const expectedColor = pixel === 0
              ? [18, 52, 86, 255]
              : (pixel === maxWidth * maxHeight - 1 ? [171, 205, 239, 255] : [0, 0, 0, 0]);
            const offset = pixel * 4;
            for (let channel = 0; channel < 4; channel += 1) {
              if (actual[offset + channel] !== expectedColor[channel]) {
                throw new Error("Maximum PNG RGBA mismatch at pixel " + pixel + ", channel " + channel +
                  ": expected " + expectedColor[channel] + ", received " + actual[offset + channel] + ".");
              }
            }
          }
        } finally {
          maxBitmap.close();
        }

        output.textContent = "PASS " + JSON.stringify({
          decoder: "Chromium createImageBitmap + OffscreenCanvas",
          pngDimensions: [expectedWidth, expectedHeight],
          decodedLayouts: ["grid with transparent gutters", "horizontal", "vertical", "grid with explicit background"],
          decodedRgbaChecks: 4,
          frameOrder: metadata.frames.map(function (frame) { return frame.frameId; }),
          frameRects: metadata.frames.map(function (frame) { return [frame.x, frame.y, frame.width, frame.height]; }),
          layout: metadata.layout,
          rgbaBytesCompared: expected.length,
          transparentPixelCount: expected.filter(function (_, index) { return index % 4 === 3; }).filter(function (alpha, index) {
            return alpha === 0;
          }).length,
          invalidCases: ["513px canvas dimension", "49-pixel output over a 48-pixel budget", "malformed HEX cel color", "sparse cel pixel", "sparse cel list", "malformed metadata buffer"],
          maximumCanvasDecoded: { dimensions: [512, 512], pixelsCompared: 512 * 512 },
          blobType: exported.blob.type,
          blobSize: exported.blob.size,
          sourceProjectUnchanged: true,
          asyncExport: {
            metadataAndRgbaMatchSync: true,
            decodedByChromium: true,
            progressEvents: asyncProgress.length,
            finalProgress: asyncProgress[asyncProgress.length - 1].progress,
            cancellationStages: ["before-start", "composition", "finalization", "finalization-after-codec"]
          }
        });
        document.body.dataset.result = "PASS";
      } catch (error) {
        output.textContent = "FAIL " + (error && error.stack ? error.stack : String(error));
        document.body.dataset.result = "FAIL";
      }
    })();
  </script>
</body>
</html>
