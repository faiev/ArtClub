<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Art Club GIF export browser verification</title>
</head>
<body>
  <pre id="result">RUNNING</pre>
  <script src="../js/gif-export.js"></script>
  <script>
    (async function () {
      const output = document.getElementById("result");
      const layer = { id: "layer-1", name: "Layer 1", visible: true, locked: false, opacity: 1 };
      const project = {
        format: "one-pixel-studio",
        version: 2,
        id: "browser-gif-check",
        name: "Browser GIF check",
        canvas: { width: 2, height: 2, background: null },
        palette: ["#ff0000", "#00ff00", "#0000ff"],
        selectedColorIndex: 0,
        layers: [layer],
        frames: [
          { id: "frame-red", name: "Red", durationMs: 100 },
          { id: "frame-blue", name: "Blue", durationMs: 200 }
        ],
        cels: [
          { layerId: layer.id, frameId: "frame-red", pixels: ["#ff0000", null, null, "#00ff00"] },
          { layerId: layer.id, frameId: "frame-blue", pixels: ["#0000ff", null, "#ffffff", null] }
        ],
        activeLayerId: layer.id,
        activeFrameId: "frame-red",
        metadata: { createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }
      };

      try {
        const exported = window.ArtClubGIFExporter.exportGIF(project, { loopCount: 0 });
        const bytes = new Uint8Array(await exported.blob.arrayBuffer());
        if (String.fromCharCode.apply(null, Array.from(bytes.slice(0, 6))) !== "GIF89a") {
          throw new Error("The exported blob does not begin with GIF89a.");
        }

        if (typeof ImageDecoder === "function") {
          const decoder = new ImageDecoder({ data: bytes, type: "image/gif" });
          await decoder.tracks.ready;
          const track = decoder.tracks.selectedTrack;
          if (!track || track.frameCount !== 2) throw new Error("Browser decoder did not find two animation frames.");

          const expectedRasters = [
            [255, 0, 0, 255, 0, 0, 0, 0, 0, 0, 0, 0, 0, 255, 0, 255],
            [0, 0, 255, 255, 0, 0, 0, 0, 255, 255, 255, 255, 0, 0, 0, 0]
          ];
          const dimensions = [];
          const rasters = [];
          for (let frameIndex = 0; frameIndex < track.frameCount; frameIndex += 1) {
            const decoded = await decoder.decode({ frameIndex: frameIndex });
            const frame = decoded.image;
            const width = frame.displayWidth || frame.codedWidth;
            const height = frame.displayHeight || frame.codedHeight;
            dimensions.push([width, height]);
            if (width !== 2 || height !== 2) {
              frame.close();
              throw new Error("Decoded frame " + frameIndex + " had unexpected dimensions " + width + "×" + height + ".");
            }
            const canvas = new OffscreenCanvas(width, height);
            const context = canvas.getContext("2d", { willReadFrequently: true });
            context.drawImage(frame, 0, 0);
            rasters.push(Array.from(context.getImageData(0, 0, width, height).data));
            frame.close();
          }
          decoder.close();

          if (JSON.stringify(dimensions) !== JSON.stringify([[2, 2], [2, 2]])) {
            throw new Error("Decoded frame dimensions did not match the native canvas: " + JSON.stringify(dimensions));
          }
          if (JSON.stringify(rasters) !== JSON.stringify(expectedRasters)) {
            throw new Error("Decoded full RGBA rasters did not match source frames (including disposal/transparent overlap): " + JSON.stringify(rasters));
          }

          // Palette-overflow compatibility: decode a median-cut GIF independently and
          // verify the seeded source RGB that exposed the former bucket-midpoint bug.
          const overflowPixels = ["#222799"];
          const seenBuckets = new Set([((0x22 >>> 3) << 10) | ((0x27 >>> 3) << 5) | (0x99 >>> 3)]);
          let state = 13;
          while (overflowPixels.length < 257) {
            state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
            const red = (state >>> 24) & 255;
            const green = (state >>> 16) & 255;
            const blue = (state >>> 8) & 255;
            const bucket = ((red >>> 3) << 10) | ((green >>> 3) << 5) | (blue >>> 3);
            if (seenBuckets.has(bucket)) continue;
            seenBuckets.add(bucket);
            overflowPixels.push("#" + [red, green, blue].map(value => value.toString(16).padStart(2, "0")).join(""));
          }
          if (overflowPixels[58] !== "#d2384e") {
            throw new Error("The deterministic palette-overflow fixture no longer has #D2384E at pixel 58.");
          }
          const overflowProject = {
            format: "one-pixel-studio",
            version: 2,
            id: "browser-gif-palette-overflow",
            name: "Palette overflow browser fixture",
            canvas: { width: 257, height: 1, background: null },
            palette: [],
            selectedColorIndex: 0,
            layers: [{ id: "layer-1", name: "Layer", visible: true, locked: false, opacity: 1 }],
            frames: [{ id: "overflow", name: "Overflow", durationMs: 145 }],
            cels: [{ layerId: "layer-1", frameId: "overflow", pixels: overflowPixels }],
            activeLayerId: "layer-1",
            activeFrameId: "overflow",
            metadata: { createdAt: "2026-01-01T00:00:00.000Z", updatedAt: "2026-01-01T00:00:00.000Z" }
          };
          const overflowExport = window.ArtClubGIFExporter.exportGIF(overflowProject);
          const overflowBytes = new Uint8Array(await overflowExport.blob.arrayBuffer());
          const overflowDecoder = new ImageDecoder({ data: overflowBytes, type: "image/gif" });
          await overflowDecoder.tracks.ready;
          const overflowTrack = overflowDecoder.tracks.selectedTrack;
          if (!overflowTrack || overflowTrack.frameCount !== 1) {
            overflowDecoder.close();
            throw new Error("Palette-overflow GIF did not decode to one frame.");
          }
          const overflowFrame = await overflowDecoder.decode({ frameIndex: 0 });
          const overflowImage = overflowFrame.image;
          const overflowWidth = overflowImage.displayWidth || overflowImage.codedWidth;
          const overflowHeight = overflowImage.displayHeight || overflowImage.codedHeight;
          if (overflowWidth !== 257 || overflowHeight !== 1) {
            overflowImage.close();
            overflowDecoder.close();
            throw new Error("Palette-overflow GIF decoded with unexpected dimensions.");
          }
          const overflowCanvas = new OffscreenCanvas(overflowWidth, overflowHeight);
          const overflowContext = overflowCanvas.getContext("2d", { willReadFrequently: true });
          overflowContext.drawImage(overflowImage, 0, 0);
          const overflowRaster = overflowContext.getImageData(0, 0, overflowWidth, overflowHeight).data;
          const pixel58 = Array.from(overflowRaster.slice(58 * 4, 58 * 4 + 4));
          overflowImage.close();
          overflowDecoder.close();
          if (JSON.stringify(pixel58) !== JSON.stringify([210, 56, 78, 255])) {
            throw new Error("Independent decoder did not preserve exact pixel 58 #D2384E: " + JSON.stringify(pixel58));
          }

          // Long-animation compatibility: verify the decoder sees the maximum
          // 256-frame sequence and that selected decoded frames retain source order.
          const longFrames = Array.from({ length: 256 }, (_, index) => ({
            id: "long-" + index,
            name: "Long frame " + index,
            durationMs: index === 0 ? 145 : (index === 1 ? 155 : 100)
          }));
          const longCels = longFrames.map((frame, index) => ({
            layerId: "layer-1",
            frameId: frame.id,
            pixels: [index % 3 === 0 ? "#ff0000" : (index % 3 === 1 ? "#00ff00" : "#0000ff")]
          }));
          const longProject = {
            format: "one-pixel-studio",
            version: 2,
            id: "browser-gif-long-animation",
            name: "Long animation browser fixture",
            canvas: { width: 1, height: 1, background: null },
            palette: ["#ff0000", "#00ff00", "#0000ff"],
            selectedColorIndex: 0,
            layers: [{ id: "layer-1", name: "Layer", visible: true, locked: false, opacity: 1 }],
            frames: longFrames,
            cels: longCels,
            activeLayerId: "layer-1",
            activeFrameId: "long-0",
            metadata: { createdAt: "2026-01-01T00:00:00.000Z", updatedAt: "2026-01-01T00:00:00.000Z" }
          };
          const longExport = window.ArtClubGIFExporter.exportGIF(longProject, { loopCount: null });
          const longBytes = new Uint8Array(await longExport.blob.arrayBuffer());
          const longDecoder = new ImageDecoder({ data: longBytes, type: "image/gif" });
          await longDecoder.tracks.ready;
          const longTrack = longDecoder.tracks.selectedTrack;
          if (!longTrack || longTrack.frameCount !== 256) {
            longDecoder.close();
            throw new Error("Maximum-length GIF did not decode to 256 frames.");
          }
          const sampledFrames = [];
          for (const index of [0, 127, 255]) {
            const decoded = await longDecoder.decode({ frameIndex: index });
            const frame = decoded.image;
            const canvas = new OffscreenCanvas(1, 1);
            const context = canvas.getContext("2d", { willReadFrequently: true });
            context.drawImage(frame, 0, 0);
            sampledFrames.push(Array.from(context.getImageData(0, 0, 1, 1).data));
            frame.close();
          }
          longDecoder.close();
          const expectedLongPixels = [
            [255, 0, 0, 255],
            [0, 255, 0, 255],
            [0, 0, 255, 255]
          ];
          if (JSON.stringify(sampledFrames) !== JSON.stringify(expectedLongPixels)) {
            throw new Error("Long GIF frame sampling was out of order: " + JSON.stringify(sampledFrames));
          }
          output.textContent = "PASS " + JSON.stringify({
            decoder: "ImageDecoder",
            frameCount: track.frameCount,
            dimensions: dimensions,
            fullRgbaRasters: rasters,
            checked: "every pixel of every decoded frame, including transparent disposal overlap",
            blobType: exported.blob.type,
            blobSize: exported.blob.size,
            compatibility: {
              paletteOverflowPixel58: pixel58,
              longAnimationFrameCount: longTrack.frameCount,
              sampledLongAnimationPixels: sampledFrames
            }
          });
          document.body.dataset.result = "PASS";
        } else {
          const url = URL.createObjectURL(exported.blob);
          try {
            const image = new Image();
            image.src = url;
            await image.decode();
            const canvas = document.createElement("canvas");
            canvas.width = 2;
            canvas.height = 2;
            const context = canvas.getContext("2d", { willReadFrequently: true });
            context.drawImage(image, 0, 0);
            const raster = Array.from(context.getImageData(0, 0, 2, 2).data);
            const expectedFirstFrame = [255, 0, 0, 255, 0, 0, 0, 0, 0, 0, 0, 0, 0, 255, 0, 255];
            if (image.naturalWidth !== 2 || image.naturalHeight !== 2 ||
                JSON.stringify(raster) !== JSON.stringify(expectedFirstFrame)) {
              throw new Error("Browser image decode returned an unexpected first-frame RGBA raster: " + JSON.stringify(raster));
            }
            output.textContent = "PASS " + JSON.stringify({
              decoder: "HTMLImageElement",
              note: "ImageDecoder unavailable; fallback verifies the complete first-frame raster only.",
              dimensions: [image.naturalWidth, image.naturalHeight],
              fullFirstFrameRgba: raster,
              blobType: exported.blob.type,
              blobSize: exported.blob.size
            });
            document.body.dataset.result = "PASS";
          } finally {
            URL.revokeObjectURL(url);
          }
        }
      } catch (error) {
        output.textContent = "FAIL " + (error && error.stack ? error.stack : String(error));
        document.body.dataset.result = "FAIL";
      }
    })();
  </script>
</body>
</html>
